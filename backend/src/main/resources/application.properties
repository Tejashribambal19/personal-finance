spring.application.name=finance-dashboard

# ===============================
# Server
# ===============================
server.port=${PORT:8081}

# ===============================
# PostgreSQL Database
# Local defaults + Railway production variables
# ===============================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:personal_finance_db}
spring.datasource.username=${PGUSER:finance_user}
spring.datasource.password=${PGPASSWORD:finance_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:FinanceDashboardLocalDevelopmentSecretKey123456789}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}